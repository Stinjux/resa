# Lancement local en une commande :  docker compose up --build
# puis ouvrir http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: resa
      POSTGRES_PASSWORD: resa
      POSTGRES_DB: resa_dev
    volumes:
      - resa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resa -d resa_dev"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development   # démo locale (en production : docker-compose.prod.yml)
      DATABASE_URL: postgres://resa:resa@db:5432/resa_dev
      AUTO_MIGRATE: "1"
      SEED_DEMO: "1"   # comptes et réservations de démonstration
      # IA (facultatif) : mettre ANTHROPIC_API_KEY=... dans un fichier .env à côté de ce fichier
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # E-mails (facultatif) : sans SMTP_URL, les e-mails sont préparés mais pas envoyés
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "3000:3000"

volumes:
  resa-db:
