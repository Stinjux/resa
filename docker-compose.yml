# Lancement local en une commande :  docker compose up --build
# puis ouvrir http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: resa
      POSTGRES_PASSWORD: resa
      POSTGRES_DB: resa_dev
    volumes:
      - resa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resa -d resa_dev"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://resa:resa@db:5432/resa_dev
      AUTO_MIGRATE: "1"
      SEED_DEMO: "1"   # comptes et réservations de démonstration
    ports:
      - "3000:3000"

volumes:
  resa-db:
